[project]
name = "flaskr-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=49.0.0",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "flask-sqlalchemy>=3.1.1",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.21",
    "mypy>=2.2.0",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "sqlparse>=0.5.5",
]

# ============================================================
# Ruff（Lint + Formatter）
# 実行: uv run ruff check .   /   uv run ruff format .
# ============================================================
[tool.ruff]
line-length = 100
# target-version は requires-python (>=3.14) から自動推定されるので省略

[tool.ruff.lint]
# E/W=pycodestyle, F=pyflakes, I=import整列(isort), UP=新記法化(pyupgrade), B=バグ検出(bugbear)
select = ["E", "W", "F", "I", "UP", "B"]

# ============================================================
# 型チェック（mypy）
# 実行: uv run mypy flaskr
# ============================================================
[tool.mypy]
python_version = "3.14"
# 型情報を持たない一部ライブラリ（flask-cors 等）のimport警告を抑制
ignore_missing_imports = true
# SQLAlchemy 2.0 の Mapped[] はプラグイン不要でそのまま解釈される
